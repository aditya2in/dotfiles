# ==========================================================
# 💎 HYPRLAND MASTER LOOK'N'FEEL (SELF-DOCUMENTING)
# ==========================================================
# Use [Baseline] values to restore the "Glassy" look I built for you.

general {
    gaps_in = 1                    # [Baseline: 5] Gap between windows
    gaps_out = 1                  # [Baseline: 10] Gap between windows and monitor edges
    border_size = 1                # [Baseline: 2] Width of the window border
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    # --- [ Window Frame ] ---
    rounding = 1                  # [Baseline: 10] Corner radius: 0=sharp, 20=macos-bubbly
    
    # --- [ Global Opacity ] ---
    # 1.0 is recommended for Passive Blur (only blurs naturally transparent apps)
    active_opacity = 0.9           # [Baseline: 1.0] Transparency of focused window
    inactive_opacity = 0.9         # [Baseline: 1.0] Transparency of background windows
    fullscreen_opacity = 1.0       # [Baseline: 1.0] Transparency of fullscreen apps

    # --- [ Dimming ] ---
    dim_inactive = false           # [Baseline: false] Dim background windows?
    dim_strength = 0.5             # [Baseline: 0.5] How much to dim (0.0 to 1.0)

    blur {
        # --- [ The Engine ] ---
        enabled = true             # [Baseline: true] Enable the frosted glass engine
        size = 12                  # [Baseline: 12] Blur radius: Higher = more fuzzy
        passes = 6                 # [Baseline: 3] Quality runs: 3 is the "Sweet Spot"
        new_optimizations = true   # [Baseline: true] Keep true for performance
        
        # --- [ Glass Quality ] ---
        xray = true                # [Baseline: true] Blurs wallpaper only (Cleaner look)
        ignore_opacity = true      # [Baseline: true] Full strength blur regardless of transparency
        special = true             # [Baseline: true] Blur behind special workspaces
        popups = true              # [Baseline: true] Blur behind popups/menus
        
        # --- [ Visual Texture ] ---
        noise = 0.01               # [Baseline: 0.01] Adds tiny grain for "frost" texture
        contrast = 0.9             # [Baseline: 0.9] 0.9 makes colors softer and modern
        brightness = 0.8           # [Baseline: 0.8] 0.8 darkens the frost for better legibility
        vibrancy = 0.16            # [Baseline: 0.16] Saturation of blurred colors
    }

    shadow {
        enabled = true             # [Baseline: true] Draw shadows under windows
        range = 4                  # [Baseline: 4] Shadow size
        render_power = 3           # [Baseline: 3] Shadow sharpness (1-4)
        color = rgba(1a1a1aee)
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
