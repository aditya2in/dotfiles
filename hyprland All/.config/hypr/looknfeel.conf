# ==========================================================
# 💎 HYPRLAND MASTER LOOK'N'FEEL (SELF-DOCUMENTING)
# ==========================================================
# Use [Baseline] values to restore the "Glassy" look I built for you.

general {
    gaps_in = 1                    # [Baseline: 5]
    gaps_out = 1                  # [Baseline: 10]
    border_size = 1                # [Baseline: 2]
    # Previous value: rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(33ccffff) rgba(00ff99ff) 45deg
    # Previous value: rgba(595959aa)
    col.inactive_border = rgba(595959ff)
    layout = dwindle
}

decoration {
    # --- [ Window Frame ] ---
    rounding = 1                  # [Baseline: 10]
    
    # --- [ Global Opacity ] ---
    # 1.0 is recommended for Passive Blur (only blurs naturally transparent apps)
    active_opacity = 1.0           # [Baseline: 1.0]
    inactive_opacity = 1.0         # [Baseline: 1.0]
    fullscreen_opacity = 1.0       # [Baseline: 1.0]

    # --- [ Dimming ] ---
    dim_inactive = false           # [Baseline: false]
    dim_strength = 0.5             # [Baseline: 0.5]

    blur {
        # --- [ The Engine ] ---
        enabled = false            # [Baseline: true]
        size = 12                  # [Baseline: 12]
        passes = 6                 # [Baseline: 3]
        new_optimizations = true   # [Baseline: true]
        
        # --- [ Glass Quality ] ---
        xray = true                # [Baseline: true]
        ignore_opacity = true      # [Baseline: true]
        special = true             # [Baseline: true]
        popups = true              # [Baseline: true]
        
        # --- [ Visual Texture ] ---
        noise = 0.01               # [Baseline: 0.01]
        contrast = 0.9             # [Baseline: 0.9]
        brightness = 0.8           # [Baseline: 0.8]
        vibrancy = 0.16            # [Baseline: 0.16]
    }

    shadow {
        enabled = true             # [Baseline: true]
        range = 4                  # [Baseline: 4]
        render_power = 3           # [Baseline: 3]
        # Previous value: rgba(1a1a1aee)
        color = rgba(1a1a1aff)
    }
}

# --- [ Animations ] ---
# Disabled for instant interactions and zero delay. 
# Re-enable by setting enabled = true.
animations {
    enabled = false

    # --- [ Animation Curves Reference ] ---
    # bezier = easeOutQuint,0.23,1,0.32,1
    # bezier = linear,0,0,1,1
    # animation = windows, 1, 4.79, easeOutQuint
    # animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
