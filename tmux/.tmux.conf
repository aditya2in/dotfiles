# --- [ 1. General Settings ] ---
set -g default-terminal "tmux-256color"
set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 0
setw -g pane-base-index 0

# --- [ 2. Prefix Configuration ] ---
# Using Ctrl+a (Caps Lock is mapped to Ctrl in Hyprland)
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix
# --- [ 3. Home Lab Dashboard (Window-Centric) ] ---
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-bg "#1e1e2e" 

# LEFT SIDE: [SESSION]
set -g status-left-length 80
set -g status-left "#[fg=#1e1e2e]#[bg=#89b4fa]#[bold] #S #[fg=#89b4fa]#[bg=default]#[nobold] "
# OPTIONAL: Use the line below instead if you do a lot of SSH and want to see [USER@HOST]
# set -g status-left "#[fg=#1e1e2e]#[bg=#89b4fa]#[bold] #S #[fg=#89b4fa]#[bg=#45475a]#[nobold]#[fg=#cdd6f4]#[bg=#45475a]  #(whoami)@#H #[fg=#45475a]#[bg=default] "

# CENTER: THE WINDOW LIST (Tight packing & Sharp boxes)
set -g window-status-format "#[fg=#6c7086]#[bg=default] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e]#[bg=#fab387]#[bold] #I:#W #[bg=default] "
set -g window-status-separator ""

# RIGHT SIDE: [REMOTE Warning (SSH only)] [TIME]
set -g status-right-length 80
# Shows NOTHING if local, but a Red [REMOTE] box if SSH'd
set -g status-right "#{?SSH_CONNECTION,#[fg=#f38ba8]#[bg=default]#[fg=#1e1e2e]#[bg=#f38ba8]#[bold] REMOTE #[fg=default]#[bg=default],}#[fg=#f9e2af]#[bg=default]#[fg=#1e1e2e]#[bg=#f9e2af]#[bold] %H:%M "

# --- [ 4. Visual Tweaks ] ---
set -g mode-style "fg=#1e1e2e,bg=#89dceb"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# --- [ 5. Custom Bindings ] ---

# A. WINDOW NAVIGATION (Direct with Alt)
# Since Ctrl+Number is hard to pass through terminal emulators, 
# using Alt+Number is the standard way to get direct switching.
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# B. PANE NAVIGATION (Vim-style with Ctrl)
# Since Caps Lock is Ctrl, this is "Caps Lock + h/j/k/l"
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# C. PANE RESIZING (Standard Prefix + h/j/k/l)
# Usage: Tap Caps Lock + A, then tap/hold h/j/k/l
bind-key -r h resize-pane -L 5
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r l resize-pane -R 5
bind-key -r m resize-pane -Z

# D. MISC
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key K confirm-before -p "kill-session #S? (y/n)" kill-session
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v
unbind r
bind r source-file ~/.tmux.conf

# --- [ 6. Plugins (TPM) ] ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

run '~/.tmux/plugins/tpm/tpm'
