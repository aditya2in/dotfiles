# --- [ 1. General Settings ] ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# --- [ 2. Prefix Configuration ] ---
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# --- [ 3. Visuals & Status Bar ] ---
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-bg "#1e1e2e" 

set -g status-left-length 80
set -g status-left "#[fg=#1e1e2e]#[bg=#89b4fa]#[bold] #S #[fg=#89b4fa]#[bg=default]#[nobold] "

set -g window-status-format "#[fg=#6c7086]#[bg=default] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e]#[bg=#fab387]#[bold] #I:#W #[bg=default]"
set -g window-status-separator "  " 

set -g status-right-length 80
set -g status-right "#{?SSH_CONNECTION,#[fg=#f38ba8]#[bg=default]#[fg=#1e1e2e]#[bg=#f38ba8]#[bold] REMOTE #[fg=default]#[bg=default],}#[fg=#89b4fa]#[bg=default]#[fg=#1e1e2e]#[bg=#89b4fa]#[bold] %H:%M "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# --- [ 4. Custom Bindings ] ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# WINDOW NAVIGATION (Alt+Number)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# PANE NAVIGATION (Vim-style with Ctrl)
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# SPLITS
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- [ 5. Plugins (TPM) ] ---
# Tell TPM to use the consolidated plugins folder
set -g @tpm_plugins_overlay_dir '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Tell Resurrect to use the consolidated resurrect folder
set -g @resurrect-dir '~/.config/tmux/resurrect'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# Initialize TMUX plugin manager (Pointing to the new internal location)
run '~/.config/tmux/plugins/tpm/tpm'
